name: serviceflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: serviceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviceflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-serviceflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - serviceflow-net

  redis:
    image: redis:7-alpine
    container_name: serviceflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - serviceflow-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serviceflow-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ServiceFlow}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-app-secret-key-change-in-production-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-jwt-secret-key-change-in-production-32chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-serviceflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_PUBSUB_URL: redis://redis:6379/1
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      PROCESSING_STEP_DELAY_SECONDS: ${PROCESSING_STEP_DELAY_SECONDS:-2.0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - serviceflow-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serviceflow-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      APP_NAME: ${APP_NAME:-ServiceFlow}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-app-secret-key-change-in-production-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-jwt-secret-key-change-in-production-32chars}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-serviceflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_PUBSUB_URL: redis://redis:6379/1
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      PROCESSING_STEP_DELAY_SECONDS: ${PROCESSING_STEP_DELAY_SECONDS:-2.0}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serviceflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serviceflow-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - serviceflow-net

volumes:
  postgres_data:
    name: serviceflow_postgres_data
  redis_data:
    name: serviceflow_redis_data

networks:
  serviceflow-net:
    name: serviceflow_network
    driver: bridge
